<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Los tutoriales de LeanLoops en el orden del ciclo, de la web al teléfono.">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Videoteca LeanLoops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  :root {
    --ground: #EEF3F1;
    --panel: #FFFFFF;
    --ink: #16211F;
    --ink-dim: #4F625D;
    --ink-faint: #7E918C;
    --line: rgba(22, 33, 31, 0.12);
    --accent: #2F8A73;
    --accent-ink: #FFFFFF;
    --accent-soft: #D5ECE5;
    --operacion: #B7851A;
    --operacion-soft: #F4E7C8;
    --stage: #0D1514;
    --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0F1716;
      --panel: #16211F;
      --ink: #EEF4F2;
      --ink-dim: #A9BDB7;
      --ink-faint: #6E847E;
      --line: rgba(255, 255, 255, 0.10);
      --accent: #5FB79E;
      --accent-ink: #0D1514;
      --accent-soft: #1E3A33;
      --operacion: #E0B03A;
      --operacion-soft: #3A3018;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0F1716;
    --panel: #16211F;
    --ink: #EEF4F2;
    --ink-dim: #A9BDB7;
    --ink-faint: #6E847E;
    --line: rgba(255, 255, 255, 0.10);
    --accent: #5FB79E;
    --accent-ink: #0D1514;
    --accent-soft: #1E3A33;
    --operacion: #E0B03A;
    --operacion-soft: #3A3018;
  }

  body { background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
  .pagina { max-width: 1320px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 36px); padding-block: 28px 48px; }

  header.cabecera { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 32px; margin-bottom: 22px; }
  .marca { display: flex; align-items: center; gap: 14px; }
  .logo { width: 44px; height: 44px; border-radius: 11px; background: linear-gradient(135deg, #3E9B84, #1E5148); color: #fff;
          display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0.5px; }
  h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 4vw, 42px); line-height: 1; letter-spacing: 0.5px;
       text-transform: uppercase; margin: 0; text-wrap: balance; }
  .bajada { color: var(--ink-dim); margin: 4px 0 0; max-width: 62ch; }
  .progreso { font-variant-numeric: tabular-nums; color: var(--ink-dim); font-size: 15px; text-align: right; }
  .progreso strong { color: var(--ink); font-family: var(--display); font-size: 26px; font-weight: 600; letter-spacing: 0.5px; }

  .cuerpo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: 28px; align-items: start; }
  @media (max-width: 960px) { .cuerpo { grid-template-columns: 1fr; } }

  .escenario { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
  .pantalla { position: relative; background: var(--stage); border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%; }
  .pantalla video, .pantalla img { width: 100%; height: 100%; display: block; object-fit: contain; background: var(--stage); }
  .sin-archivo { position: absolute; inset: auto 0 0 0; padding: 10px 14px; background: rgba(13, 21, 20, 0.8); color: #EEF4F2; font-size: 14px; }
  .ficha { margin-top: 16px; display: grid; gap: 6px; }
  .ficha .etapa { font-family: var(--display); font-weight: 600; letter-spacing: 2px; text-transform: uppercase; font-size: 15px; color: var(--accent); }
  .ficha h2 { font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 1.05; margin: 0; text-wrap: balance; }
  .ficha p { margin: 0; color: var(--ink-dim); max-width: 68ch; }
  .controles { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  button { font: inherit; cursor: pointer; border-radius: 9px; padding: 8px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button.primario { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  button:focus-visible, a:focus-visible, li.item:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  label.seguido { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-dim); font-size: 15px; }

  nav.lista { display: grid; gap: 22px; }
  .grupo h3 { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 2.5px; text-transform: uppercase;
              color: var(--ink-faint); margin: 0 0 8px; display: flex; justify-content: space-between; }
  .grupo ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  li.item { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; align-items: center; padding: 7px; border-radius: 11px;
            cursor: pointer; border: 1px solid transparent; }
  li.item:hover { background: var(--panel); border-color: var(--line); }
  li.item[aria-current="true"] { background: var(--panel); border-color: var(--accent); }
  .mini { position: relative; border-radius: 7px; overflow: hidden; aspect-ratio: 16 / 9; background: var(--stage); }
  .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mini .dur { position: absolute; right: 4px; bottom: 4px; background: rgba(13, 21, 20, 0.82); color: #fff; font-size: 12px;
               padding: 1px 6px; border-radius: 4px; font-variant-numeric: tabular-nums; }
  .mini .visto { position: absolute; left: 4px; top: 4px; width: 20px; height: 20px; border-radius: 20px; background: var(--accent);
                 color: var(--accent-ink); font-size: 13px; display: grid; place-items: center; font-weight: 700; }
  .texto { min-width: 0; display: grid; gap: 2px; }
  .chip { justify-self: start; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
          padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
  .chip.operacion { background: var(--operacion-soft); }
  .texto strong { font-weight: 600; font-size: 16px; line-height: 1.25; }

  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>

      <div class="logo" aria-hidden="true">LL</div>
      <div>
        <h1>Videoteca LeanLoops</h1>
        <p class="bajada">Los tutoriales en el orden del ciclo, del mapa de procesos al teléfono en terreno. Cada video sigue al anterior.</p>
      </div>

    <nav class="lista" id="lista" aria-label="Tutoriales"></nav>

</div>

  function dibujarLista() {

    $("f-etapa").textContent = v.etapa;
    $("f-titulo").textContent = v.titulo;
    $("f-que").textContent = v.que;
    $("anterior").disabled = actual === 0;
    $("siguiente").disabled = actual === VIDEOS.length - 1;
    history.replaceState(null, "", `#${v.id}`);
    guardar(v.id);
    dibujarLista();
  }

  $("anterior").addEventListener("click", () => abrir(actual - 1, true));
  $("siguiente").addEventListener("click", () => abrir(actual + 1, true));

  const pedido = location.hash.slice(1) || guardado.ultimo;
  const inicio = Math.max(0, VIDEOS.findIndex((v) => v.id === pedido));
  abrir(inicio, false);
</script>
</body>
</html>
